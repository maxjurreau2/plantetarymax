name = "portal-os"
main = "src/worker.ts"
compatibility_date = "2024-08-01"

[durable_objects]
bindings = {
  SubstrateDO = { class_name = "SubstrateDO" },
  BrokerDO = { class_name = "BrokerDO" }
}

[exports.SubstrateDO]
type = "durable-object"
storage = "sqlite"
state = "created"

[exports.BrokerDO]
type = "durable-object"
storage = "sqlite"
state = "created"

[build]
command = "npm install && npm run build"

[env.dev]
name = "portal-os-dev"
workers_dev = true

[env.production]
name = "portal-os"
workers_dev = false
route = "https://portal-os.com/*"
zone_id = "2ef7ed61291f88b00e217731f446a140"
