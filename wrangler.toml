name = "portal-os"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "SubstrateDO", class_name = "SubstrateDO" },
  { name = "BrokerDO", class_name = "BrokerDO" }
]

[exports.SubstrateDO]
type = "durable-object"
state = "created"
storage = "sqlite"

[exports.BrokerDO]
type = "durable-object"
state = "created"
storage = "sqlite"

[env.dev]
name = "portal-os"
workers_dev = true
account_id = "8cbc375a878f16f16c058e8f6b212398"
subdomain = "max-orion1"
