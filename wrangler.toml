name = "portal-os"
main = "src/worker.ts"
compatibility_date = "2024-08-01"
pages_build_output_dir = "dist"

[durable_objects]
bindings = { SubstrateDO = { class_name = "SubstrateDO" },
             BrokerDO    = { class_name = "BrokerDO" } }

[exports.SubstrateDO]
type = "durable-object"
storage = "sqlite"
state = "created"

[exports.BrokerDO]
type = "durable-object"
storage = "sqlite"
state = "created"
