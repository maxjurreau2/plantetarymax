name = "portal-os"
main = "src/worker.ts"
compatibility_date = "2024-08-01"

# --------------------------------------------------
# Durable Objects Bindings
# --------------------------------------------------
[durable_objects.bindings]
name = "SubstrateDO"
class_name = "SubstrateDO"

[durable_objects.bindings]
name = "BrokerDO"
class_name = "BrokerDO"

# --------------------------------------------------
# Durable Object Migrations (SQLite Storage)
# --------------------------------------------------
[migrations]
tag = "v1"
new_sqlite_classes = "SubstrateDO"

# --------------------------------------------------
# Build
# --------------------------------------------------
[build]
command = "npm install && npm run build"

# --------------------------------------------------
# DEVELOPMENT
# --------------------------------------------------
[env.dev]
name = "portal-os-dev"
workers_dev = true

# --------------------------------------------------
# PRODUCTION (portal-os.com)
# --------------------------------------------------
[env.production]
name = "portal-os"
workers_dev = false
route = "https://portal-os.com/*"
zone_id = "2ef7ed61291f88b00e217731f446a140"
