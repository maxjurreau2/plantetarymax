name = "portal-os"
main = "src/worker.ts"
compatibility_date = "2024-08-01"
pages_build_output_dir = "dist"

# --------------------------------------------------
# Durable Objects (v2 schema)
# --------------------------------------------------
[[durable_objects]]
name = "SubstrateDO"
class_name = "SubstrateDO"

[[durable_objects]]
name = "BrokerDO"
class_name = "BrokerDO"

[exports.SubstrateDO]
type = "durable-object"
storage = "sqlite"
state = "created"

[exports.BrokerDO]
type = "durable-object"
storage = "sqlite"
state = "created"

[build]
command = "npm run build"
cwd = "."

[env.dev]
name = "portal-os-dev"
workers_dev = true

[env.production]
name = "portal-os"
workers_dev = true
