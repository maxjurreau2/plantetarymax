name = "portal-os"
main = "src/index.ts"
compatibility_date = "2024-08-01"

# -----------------------------
# Durable Objects (Workers v2)
# -----------------------------
[durable_objects]
bindings = {
  SubstrateDO = { class_name = "SubstrateDO" },
  BrokerDO = { class_name = "BrokerDO" }
}

[exports.SubstrateDO]
type = "durable-object"
storage = "sqlite"

[exports.BrokerDO]
type = "durable-object"
storage = "sqlite"

# -----------------------------
# Environment Variables (Hybrid)
# -----------------------------
[vars]
# Python kernel status endpoint (optional)
KERNEL_STATUS_URL = ""

# Message queue (Python or external)
MESSAGE_QUEUE_URL = ""
MESSAGE_QUEUE_RPC_URL = ""

# Identity service (optional)
IDENTITY_URL = ""
IDENTITY_ADAPTER_RPC = ""

# Governance service (optional)
GOVERNANCE_URL = ""
GOVERNANCE_ADAPTER_RPC = ""

# Broker publish token
EVENTS_PUBLISH_TOKEN = "dev-token"

# -----------------------------
# Node compatibility (optional)
# -----------------------------
[build]
command = "npm run build"
