name = "portal-os"
main = "src/worker.ts"
compatibility_date = "2024-08-01"

# --------------------------------------------------
# Durable Objects Bindings
# --------------------------------------------------
[durable_objects.bindings]
name = "SubstrateDO"
class_name = "SubstrateDO"

[durable_objects.bindings]
name = "BrokerDO"
class_name = "BrokerDO"

# --------------------------------------------------
# Durable Object Migrations (SQLite Storage)
# --------------------------------------------------

# --------------------------------------------------
# Build
# --------------------------------------------------
[build]
command = "npm install && npm run build"

# --------------------------------------------------
# DEVELOPMENT
# --------------------------------------------------
[env.dev]
name = "portal-os-dev"
workers_dev = true

# --------------------------------------------------
# PRODUCTION (portal-os.com)
# --------------------------------------------------
[env.production]
name = "portal-os"
workers_dev = false
route = "https://portal-os.com/*"
zone_id = "2ef7ed61291f88b00e217731f446a140"

[vars]
KERNEL_STATUS_URL = "https://kernel.planetarymax.com/kernel/status"
MESSAGE_QUEUE_RPC_URL = "https://kernel.planetarymax.com/queue/enqueue"
IDENTITY_ADAPTER_RPC = "https://kernel.planetarymax.com/identity/check"
GOVERNANCE_ADAPTER_RPC = "https://kernel.planetarymax.com/governance/check"
EVENTS_PUBLISH_TOKEN = "dev-token"
REDIS_URL = "redis://localhost:6379/0"

