name = "portal-os"
main = "src/index.ts"
compatibility_date = "2024-08-01"

[durable_objects]
bindings = {
  SubstrateDO = { class_name = "SubstrateDO" },
  BrokerDO = { class_name = "BrokerDO" }
}

[exports.SubstrateDO]
type = "durable-object"
storage = "sqlite"

[exports.BrokerDO]
type = "durable-object"
storage = "sqlite"

[vars]
KERNEL_STATUS_URL = "https://kernel.planetarymax.com/kernel/status"
MESSAGE_QUEUE_RPC_URL = "https://kernel.planetarymax.com/queue/enqueue"
IDENTITY_ADAPTER_RPC = "https://kernel.planetarymax.com/identity/check"
GOVERNANCE_ADAPTER_RPC = "https://kernel.planetarymax.com/governance/check"
EVENTS_PUBLISH_TOKEN = "dev-token"
REDIS_URL = "redis://localhost:6379/0"
